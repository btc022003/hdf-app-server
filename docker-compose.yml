version: '3.8'

services:
  # ============================================
  # PostgreSQL 数据库服务
  # ============================================
  postgres:
    image: postgres:16
    container_name: pg-hys
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: hys-app
      TZ: "Asia/Shanghai"
    ports:
      - "8988:5432"
    volumes:
      - ./data/db/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hys-app"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # NestJS 应用服务
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hdf-app
    restart: unless-stopped
    environment:
      # Prisma 数据库连接 - 指向 compose 中的 postgres 服务
      DATABASE_PgSQL_URL: "postgresql://postgres:123456@postgres:5432/hys-app"
      NODE_ENV: production
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================
  # MySQL 服务（默认关闭，如需使用取消注释）
  # ============================================
  # mysqldb:
  #   image: mysql:8.0.21
